[package]
name = "mindscape-canvas"
version = "0.4.0"
description = "Mindscape 脑海空间 — 把已有的文件夹变成可自由摆放与连线的思考画布"
authors = ["weiyi251"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindscape_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：启用 assetProtocol（17.10）以通过 tauri:// 通道直接显示本地图片。
# tauri-build 会校验 Cargo.toml 的 feature 与 tauri.conf.json 的 security.assetProtocol 一致，
# 缺这个 feature 会直接编译失败。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# 应用内检查更新（Tauri 官方插件）。检查端点与签名公钥来自 tauri.conf.json 的
# plugins.updater；私钥不参与编译，仅在发布构建时经 TAURI_SIGNING_PRIVATE_KEY 传入。
tauri-plugin-updater = "2"
# 更新安装完成后重启应用（前端 relaunch 用）
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 缩略图与图片尺寸读取（17.5 指定）。只启用需要的解码器以缩短编译时间；
# webp 用于缩略图输出（image crate 仅支持无损 WebP 编码，见 T1.4 的决策记录）。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }


# 跨平台依赖到此为止；平台特有依赖见下方 target 段。

# Windows 专有：系统剪贴板文件互通（2026-09-13 用户批准引入）。
# Tauri 官方 clipboard 插件只支持文本/图片，无法读写文件列表（CF_HDROP）；
# clipboard-win 专门负责「空间内复制 → 资源管理器粘贴」与反向链路。
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
