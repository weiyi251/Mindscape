# Mindscape 发版构建 —— 产出 Windows 安装包与安卓 APK
#
# 与 ci.yml 的分工：ci.yml 只做质量门（不产出安装包），本工作流只做构建。
# 触发方式：推送 v 开头的标签（版本号提交之后打 tag 推上来），或手动 workflow_dispatch。
#
# ⚠️ 这里**不做 updater 签名**：签名私钥只存在于开发机（~/.tauri/mindscape.key），
#    不进仓库、也不进 CI secrets。所以构建时把 createUpdaterArtifacts 关掉，
#    产出的安装包是未签名的；`.sig` 与 latest.json 由开发机下载产物后本地补签再上传。
#    私钥永远不离开开发机，CI 只负责它擅长的那部分（工具链齐全、环境干净）。
# ⚠️ 安卓侧同理：release 签名需要 keystore（同样只在开发机），这里只出 debug 签名的 APK
#    —— 能装机、能测，正式分发用的签名包仍走本机 `pnpm android --release`。

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: 桌面 · Windows 安装包（NSIS / MSI，未签名）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 ci.yml 同口径：pnpm-workspace.yaml 用的是 pnpm 10+ 写法，9 会解析失败
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # createUpdaterArtifacts 关掉后就不再去找签名私钥（私钥不在 CI 上，见文件头说明）
      # ⚠️ 必须 shell: bash —— 默认的 PowerShell 会把单引号 JSON 里的双引号吃掉，
      #    CLI 收到 `{bundle:{createUpdaterArtifacts:false}}` 报「key must be a string」
      - name: 构建安装包
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 上传 NSIS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传 MSI 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: 移动 · 安卓 APK（debug 签名）
    runs-on: ubuntu-latest
    env:
      # ubuntu 镜像自带 Android SDK；NDK 版本号与开发机一致（26.3.11579264）
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
      NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust 稳定版与安卓 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # gradle 与 tauri CLI 都要 JDK；Tauri 2 的安卓工程锁 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ⚠️ 不用 android-actions/setup-android@v3：它会去装已经下架的 `tools` 包，
      #    在带 cmdline-tools 16.0 的新镜像上必然失败（Failed to find package 'tools'）。
      #    ubuntu 镜像本身就带 SDK，缺的只是 NDK 与 build-tools，用 sdkmanager 补即可。
      - name: 接受许可并补装 NDK / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      # gen/android 是 CLI 生成物、不入库（.gitignore），换环境必须重新 init
      - name: 生成安卓工程
        run: pnpm tauri android init

      - name: 构建 APK（arm64 / debug）
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
