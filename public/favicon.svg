<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Mindscape 脑海空间">
  <defs>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A7D6A" />
      <stop offset="1" stop-color="#46614F" />
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <clipPath id="tile">
