    <line x1="512" y1="668" x2="704" y2="318" />
  </g>
  <circle cx="320" cy="318" r="78" fill="#F5F3EF" />
  <circle cx="704" cy="318" r="78" fill="#F5F3EF" />
  <circle cx="512" cy="668" r="96" fill="#C4703E" />
